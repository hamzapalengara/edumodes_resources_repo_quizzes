<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1200" viewBox="0 0 800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ring background -->
  <rect width="800" height="1200" fill="#1A1A1A"/>
  
  <!-- Ring canvas -->
  <rect x="100" y="100" width="600" height="1000" fill="#2C2C2C"/>
  
  <!-- Ring ropes -->
  <g stroke="#FF0000" stroke-width="4" opacity="0.3">
    <!-- Top rope -->
    <line x1="50" y1="300" x2="750" y2="300" />
    <!-- Middle rope -->
    <line x1="50" y1="600" x2="750" y2="600" />
    <!-- Bottom rope -->
    <line x1="50" y1="900" x2="750" y2="900" />
  </g>
  
  <!-- Ring posts -->
  <g fill="#FFD700">
    <!-- Top left post -->
    <circle cx="50" cy="300" r="10" />
    <!-- Top right post -->
    <circle cx="750" cy="300" r="10" />
    <!-- Bottom left post -->
    <circle cx="50" cy="900" r="10" />
    <!-- Bottom right post -->
    <circle cx="750" cy="900" r="10" />
  </g>
  
  <!-- Ring corners -->
  <g fill="#FFD700" opacity="0.5">
    <!-- Top left corner -->
    <path d="M 50,300 Q 100,300 100,350" stroke="#FFD700" stroke-width="4" fill="none"/>
    <!-- Top right corner -->
    <path d="M 750,300 Q 700,300 700,350" stroke="#FFD700" stroke-width="4" fill="none"/>
    <!-- Bottom left corner -->
    <path d="M 50,900 Q 100,900 100,850" stroke="#FFD700" stroke-width="4" fill="none"/>
    <!-- Bottom right corner -->
    <path d="M 750,900 Q 700,900 700,850" stroke="#FFD700" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Ring shadows -->
  <rect x="100" y="100" width="600" height="1000" fill="url(#ringGradient)" opacity="0.2"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg> 